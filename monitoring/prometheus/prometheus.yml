global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ─── Application Services ─────────────────────────
  - job_name: "gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
        labels:
          service: gateway

  - job_name: "auth"
    metrics_path: /metrics
    static_configs:
      - targets: ["auth:5000"]
        labels:
          service: auth

  # ─── Infrastructure ───────────────────────────────
  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          service: rabbitmq

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
