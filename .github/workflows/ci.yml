name: CI — Lint, Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  PYTHON_VERSION: "3.12"

jobs:
  # ──────────────────────── Lint ────────────────────────
  lint:
    name: Lint (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, gateway, converter, notification]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 src/${{ matrix.service }}/ \
            --max-line-length=120 \
            --exclude=__pycache__,authenv,venv,.eggs \
            --count --show-source --statistics

  # ──────────────────────── Test ────────────────────────
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        service: [auth, gateway, converter, notification]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r src/${{ matrix.service }}/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        working-directory: src/${{ matrix.service }}
        run: |
          pytest tests/ -v \
            --cov=. --cov-report=xml --cov-report=term-missing \
            --junitxml=../../test-results/${{ matrix.service }}.xml \
            || true
        env:
          MYSQL_HOST: localhost
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_DB: test
          JWT_SECRET: test-secret
          VIDEO_QUEUE: video
          MP3_QUEUE: mp3

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: src/${{ matrix.service }}/coverage.xml

  # ──────────────────────── Build & Push Docker ────────────────────────
  build:
    name: Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - service: auth
            image: mp3-auth
          - service: gateway
            image: mp3-gateway
          - service: converter
            image: mp3-converter
          - service: notification
            image: mp3-notification
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./src/${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────── Security Scan ────────────────────────
  security-scan:
    name: Security Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - service: auth
            image: mp3-auth
          - service: gateway
            image: mp3-gateway
          - service: converter
            image: mp3-converter
          - service: notification
            image: mp3-notification
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
