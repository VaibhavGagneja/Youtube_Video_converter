# ─── Global Settings ────────────────────────────────────────────
global:
  image:
    repository: vaibhavgagneja
    tag: latest
    pullPolicy: IfNotPresent

# ─── Auth Service ───────────────────────────────────────────────
auth:
  replicas: 1
  image:
    name: mp3-auth
  port: 5000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  env:
    MYSQL_HOST: mysql
    MYSQL_DB: auth
    MYSQL_PORT: "3306"

# ─── Gateway Service ───────────────────────────────────────────
gateway:
  replicas: 2
  image:
    name: mp3-gateway
  port: 8080
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    AUTH_SVC_ADDRESS: "auth:5000"
  ingress:
    enabled: true
    host: mp3converter.com
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 70

# ─── Converter Service ─────────────────────────────────────────
converter:
  replicas: 2
  image:
    name: mp3-converter
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    VIDEO_QUEUE: video
    MP3_QUEUE: mp3
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 60

# ─── Notification Service ──────────────────────────────────────
notification:
  replicas: 1
  image:
    name: mp3-notification
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi
  env:
    MP3_QUEUE: mp3

# ─── MySQL ──────────────────────────────────────────────────────
mysql:
  enabled: true
  image: mysql:8.0
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  storage: 10Gi

# ─── MongoDB ────────────────────────────────────────────────────
mongodb:
  enabled: true
  image: mongo:7.0
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  storage: 20Gi

# ─── RabbitMQ ───────────────────────────────────────────────────
rabbitmq:
  enabled: true
  image: rabbitmq:3.13.7-management
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  storage: 5Gi
