# Gateway PDB — always keep at least 1 pod available
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-pdb
  labels:
    app: gateway
    {{- include "video-converter.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway
---
# Converter PDB — always keep at least 1 converter running
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: converter-pdb
  labels:
    app: converter
    {{- include "video-converter.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: converter
